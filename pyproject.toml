[project]
name = "forrt-replication-mcp"
version = "0.1.0"
description = "MCP server for producing verifiable FORRT replication chains — grounded quote verification and compact Science Live constellation projections."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anne Fouilloux" }]
keywords = ["mcp", "replication", "reproducibility", "open-science", "nanopublication", "FORRT", "science-live"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.2.0,<2",  # 2.0 dropped mcp.server.fastmcp; the server wrapper needs the 1.x SDK
    "pypdf>=4",       # PDF text extraction for verify_quote
]

[project.urls]
Homepage = "https://github.com/ScienceLiveHub/forrt-replication-mcp"
Repository = "https://github.com/ScienceLiveHub/forrt-replication-mcp"
"Replication template" = "https://github.com/ScienceLiveHub/forrt-replication-template"
"Science Live" = "https://sciencelive4all.org"

[project.scripts]
forrt-replication-mcp = "forrt_replication_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forrt_replication_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
